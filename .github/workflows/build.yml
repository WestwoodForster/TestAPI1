name: Build .NET Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Restore NuGet Packages
      run: nuget restore TestAPI1.sln

    - name: Build Project
      run: msbuild TestAPI1.sln /p:Configuration=Release /p:Platform="Any CPU"
