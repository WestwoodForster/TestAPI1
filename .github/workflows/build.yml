name: Build and Promote Release

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual trigger if needed

jobs:
  # -------------------------------------------------------------
  # JOB 1: Build Once (Produces the immutable zip package)
  # -------------------------------------------------------------
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore TestAPI1.sln

    - name: Build and Package Web App
      run: |
        msbuild TestAPI1.sln /p:Configuration=Release `
          /p:DeployOnBuild=true `
          /p:DeployDefaultTarget=WebPublish `
          /p:WebPublishMethod=FileSystem `
          /p:PublishUrl="${{ github.workspace }}\publish"

    - name: Compress Publish Output
      run: |
        Compress-Archive -Path "${{ github.workspace }}\publish\*" -DestinationPath "${{ github.workspace }}\TestAPI1-package.zip"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TestAPI1-package
        path: "${{ github.workspace }}/TestAPI1-package.zip"

  # -------------------------------------------------------------
  # JOB 2: Deploy to Dev (Automatic on every Release)
  # -------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    runs-on: windows-latest
    needs: build
    environment:
      name: Dev
      url: https://testapi1-dchgdrg2g3c4ftex.uksouth-01.azurewebsites.net/

    steps:
    - name: Download Build Package
      uses: actions/download-artifact@v4
      with:
        name: TestAPI1-package

    - name: Deploy to Dev Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'TestAPI1' # Change to Dev app name when splitting
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: './TestAPI1-package.zip'

  # -------------------------------------------------------------
  # JOB 3: Deploy to Test (Pauses for Approval)
  # -------------------------------------------------------------
  deploy-test:
    name: Deploy to Test
    runs-on: windows-latest
    needs: deploy-dev
    environment:
      name: Test
      url: https://testapi1-dchgdrg2g3c4ftex.uksouth-01.azurewebsites.net/

    steps:
    - name: Download Build Package
      uses: actions/download-artifact@v4
      with:
        name: TestAPI1-package

    - name: Deploy to Test Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'TestAPI1' # Change to Test app name when splitting
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: './TestAPI1-package.zip'

  # -------------------------------------------------------------
  # JOB 4: Deploy to Live (Pauses for Approval)
  # -------------------------------------------------------------
  deploy-live:
    name: Deploy to Live
    runs-on: windows-latest
    needs: deploy-test
    environment:
      name: Live
      url: https://testapi1-dchgdrg2g3c4ftex.uksouth-01.azurewebsites.net/

    steps:
    - name: Download Build Package
      uses: actions/download-artifact@v4
      with:
        name: TestAPI1-package

    - name: Deploy to Live Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'TestAPI1' # Change to Live app name when splitting
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: './TestAPI1-package.zip'
